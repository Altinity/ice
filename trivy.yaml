vulnerability:
  ignoredVulns:
    # --- Maven dependency false positive ---
    - id: CVE-2026-102554
      # guava is resolved to 33.7.2-jre via dependencyManagement in pom.xml.
      # Trivy's static pom parser sees 33.5.0-jre from iceberg-bundled-guava's
      # transitive dependency, but Maven overrides it. False positive.

    # --- distroless base image (gcr.io/distroless/java21-debian12) ---
    # These are unpatched in Debian 12 bookworm. The latest distroless image
    # ships the same vulnerable versions. Nothing to fix on our side; suppress
    # until Debian releases patches and distroless rebuilds.

    # libbrotli1
    - id: CVE-2026-111497
      # brotli: Out-of-Bounds Write. Fix available (deb12u1) but not yet in distroless.

    # libexpat1
    - id: CVE-2024-28757
      # expat: XML Entity Expansion. Fix: 2.5.0-1+deb12u4.
    - id: CVE-2025-59375
      # expat: large dynamic allocation. Fix: 2.5.0-1+deb12u5.
    - id: CVE-2026-113351
      # expat: DoS via XML_ParserReset. Status: fix_deferred.
    - id: CVE-2026-115506
      # expat: DoS via delayed entity amplification. Status: fix_deferred.
    - id: CVE-2026-117610
      # expat: NULL pointer dereference. Status: affected (no fix).
    - id: CVE-2026-118370
      # expat: integer overflow in attribute parsing. Status: affected (no fix).
    - id: CVE-2026-25210
      # libexpat: integer overflow. Fix: 2.5.0-1+deb12u4.
    - id: CVE-2026-45186
      # libexpat: DoS via crafted XML. Fix: 2.5.0-1+deb12u4.
    - id: CVE-2026-66046
      # expat: quadratic complexity in attribute processing. Fix: 2.5.0-1+deb12u4.
    - id: CVE-2026-76957
      # libexpat: memory corruption. Fix: 2.5.0-1+deb12u3.
    - id: CVE-2026-77214
      # expat: heap buffer over-read. Fix: 2.5.0-1+deb12u5.
    - id: CVE-2026-93990
      # expat: XML Injection via malformed UTF-16. Fix: 2.5.0-1+deb12u4.

    # liblcms2-2
    - id: CVE-2026-41254
      # lcms2: info disclosure / DoS. Fix: 2.14-2+deb12u1.

    # libuuid1 (util-linux)
    - id: CVE-2026-53613
      # util-linux: TOCTOU in mount. Status: affected (no fix).
    - id: CVE-2026-53615
      # util-linux: integer overflow in DOS partition parser. Status: affected.
    - id: CVE-2026-78410
      # util-linux: restricted bind mounts bypass. Status: affected.

    # zlib1g
    - id: CVE-2023-45853
      # zlib: integer overflow in zipOpenNewFileInZip4_64. Status: will_not_fix.
    - id: CVE-2026-85091
      # zlib: heap buffer overflow in gz_vacate(). Status: affected (no fix).
